name: goodreader
description: "GoodReader - a free, open-source local ebook reader (EPUB / TXT / PDF)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI / state
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Import / parsing
  file_picker: ^8.1.2
  archive: ^3.6.1
  xml: ^6.5.0
  html: ^0.15.4
  crypto: ^3.0.5
  fast_gbk: ^1.0.0

  # Reading experience
  flutter_tts: ^4.0.2
  intl: ^0.19.0
  fl_chart: ^0.69.0
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
